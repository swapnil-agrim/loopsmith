name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]   # the plugin claims python3-stdlib portability — prove it on both
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest pytest-cov
      # `tests/` only — never insight/tests/, so this job (and its --cov=skills --cov=hooks
      # denominator below) never needs insight's deps (duckdb). See the `insight` job.
      - name: pytest + coverage (includes the leakage gate + the hook behavioral-spec)
        run: python -m pytest tests/ -q --cov=skills --cov=hooks --cov-report=term-missing --cov-fail-under=85
      - name: quality gate (Tier-1 behavioral drift vs baseline)
        run: python3 evals/run.py

  # NOT a required status check yet — branch protection lists only test (3.10)/(3.12), so this job
  # is advisory and `work.auto_merge: protected` would merge a PR whose insight tests failed.
  # Tracked as issue #167, which cannot land inside this change: protection is out-of-band repo
  # config that cannot be committed atomically with a diff, and requiring a check before the job
  # exists on main would strand main if this PR were ever closed unmerged.
  insight:
    # Separate job, separate coverage gate (spec §1.1 rule 2 / issue #96, E0.S3): insight/ has its
    # own deps (duckdb) that the plugin job above must never need, and an insight/ test failure
    # must fail only this job, never `test`. Coverage is scoped to `--cov=insight`, so it can never
    # add to (or subtract from) the plugin's `--cov=skills --cov=hooks --cov-fail-under=85` figure.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]   # mirrors the plugin matrix; insight/pyproject.toml floors at 3.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest pytest-cov
      - name: install insight/ and its own deps (duckdb) — the plugin job never runs this
        run: python -m pip install -e insight/
      - name: pytest + coverage, scoped to insight/ only
        run: python -m pytest insight/tests/ -q --cov=insight --cov-report=term-missing --cov-fail-under=85
