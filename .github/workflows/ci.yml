name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]   # the plugin claims python3-stdlib portability — prove it on both
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest pytest-cov
      # `tests/` only — never insight/tests/, so this job (and its --cov=skills --cov=hooks
      # denominator below) never needs insight's deps (duckdb). See the `insight` job.
      - name: pytest + coverage (includes the leakage gate + the hook behavioral-spec)
        run: python -m pytest tests/ -q --cov=skills --cov=hooks --cov-report=term-missing --cov-fail-under=85
      - name: quality gate (Tier-1 behavioral drift vs baseline)
        run: python3 evals/run.py

  # Required alongside test (3.10)/(3.12): branch protection requires FIVE contexts — test
  # (3.10), test (3.12), insight (3.10), insight (3.12), web — all with strict: true, verified
  # live against the repo's branch-protection API on 2026-08-04 (issue #297 comment 2). The
  # previous footnote here claimed this job was advisory pending issue #167; #167 is closed,
  # protection was corrected without a tracking issue, and the stale claim survived long enough
  # to become actively wrong. Nothing currently re-verifies this fact if it drifts again — that
  # residual risk is accepted, not solved, by this correction. (The `web` job below made the same
  # stale claim in its own header comment; both are fixed together here, stated once, so the two
  # cannot drift apart into two different paraphrases again.)
  insight:
    # Separate job, separate coverage gate (spec §1.1 rule 2 / issue #96, E0.S3): insight/ has its
    # own deps (duckdb) that the plugin job above must never need, and an insight/ test failure
    # must fail only this job, never `test`. Coverage is scoped to `--cov=insight`, so it can never
    # add to (or subtract from) the plugin's `--cov=skills --cov=hooks --cov-fail-under=85` figure.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]   # mirrors the plugin matrix; insight/pyproject.toml floors at 3.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # httpx (issue #299 [E16.S1], .sdlc/plans/299.md Decision 2): needed only by
      # fastapi.testclient.TestClient (insight/tests/test_api_health.py), never by the shipped
      # insight/api/ app — deliberately NOT in insight/pyproject.toml's [project.dependencies],
      # so it rides this ad hoc line instead, the same way pytest/pytest-cov already do, rather
      # than shipping a test-only package in the product wheel.
      - run: python -m pip install --upgrade pip pytest pytest-cov httpx
      - name: install insight/ and its own deps (duckdb, fastapi) — the plugin job never runs this
        run: python -m pip install -e insight/
      - name: pytest + coverage, scoped to insight/ only
        run: python -m pytest insight/tests/ -q --cov=insight --cov-report=term-missing --cov-fail-under=85

  # Required alongside test (3.10)/(3.12) and insight (3.10)/(3.12) — see the `insight` job's
  # comment above for the corrected, five-context fact (this job is one of the five); it is stated
  # there once, in full, rather than repeated here as a second paraphrase that could drift from it.
  # Runs insight/verify_web.py, the SAME script `.sdlc/config.json`'s verify.command calls (that
  # file is gitignored — see the PR body for the out-of-band edit it also needs). Pre-E17.S1 there
  # is no insight/web/package.json yet: verify_web.py SKIPs loudly and exits 0 rather than silently
  # passing something it never ran.
  #
  # CI and the local gate now DELIBERATELY DIFFER by exactly one check (issue #303 [E17.S2] review
  # fix, superseding the "one definition, cannot drift" claim this comment used to make): `npm run
  # test` (part of verify_web.py's CHECKS) no longer runs prove-fonts-actually-apply.mjs, because
  # that script needs a real Chromium-family browser, and verify_web.py's `test` check runs inside
  # `.sdlc/config.json`'s repo-wide `verify.command`, in a FRESH worktree, for EVERY goal in this
  # repo, with verify.enforce: true — a machine with neither system Chrome nor an installed
  # Playwright Chromium (a plain Linux dev box, a fresh contributor checkout, a minimal container,
  # any non-GitHub CI) would park EVERY goal, not just web ones, on a proof it cannot run. The font
  # proof still runs — as its own `npm run prove:fonts` step below, straight after this one, in
  # THIS job — where a browser is provisioned explicitly (see the install step below) rather than
  # assumed from the runner image, so it never skips here either. Since `web`
  # is one of the five required branch-protection contexts (see the `insight` job's comment above),
  # the font proof still hard-gates every merge to main; it has just moved out of the repo-wide
  # local gate and into the one place guaranteed to have a browser.
  web:
    runs-on: ubuntu-latest
    # issue #304 [E17.S3], .sdlc/plans/304.md Step 5. Job-level, not step-level: this job's own
    # `npm run build` (inside `python3 insight/verify_web.py`'s CHECKS, below) is the SAME `.next`
    # output prove-absence-primitives-render.mjs starts its server from later in this job (no
    # rebuild) -- the env var must be set before that build runs, not just before the Playwright
    # step. `insight/web/src/app/dev/absence-states/page.tsx` reads this to gate itself out of
    # every OTHER build (local always-on gate, the shipped Docker image) where it is unset.
    env:
      INSIGHT_DEV_ROUTES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: setup-node (cached — once insight/web/package-lock.json exists)
        if: hashFiles('insight/web/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: insight/web/package-lock.json
      - name: setup-node (no cache yet — insight/web/ not landed, E17.S1)
        if: hashFiles('insight/web/package-lock.json') == ''
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # prove-login-form-issues-a-usable-session.mjs signs in through the REAL credential bridge --
      # the Node tier shells out to `insight users verify`, which hashes with argon2id -- because
      # that is the code path a browser sign-in actually takes. Every OTHER web proof stubs
      # `python3` (see prove-python-bridge-exit-codes.mjs), which is why this job never needed a
      # Python dependency before and why it could not have caught a real sign-in failing.
      #
      # actions/setup-python rather than `pip install --user` against the runner's system python3:
      # ubuntu-latest is PEP 668 externally-managed, so installing into it needs
      # --break-system-packages. This mirrors what the `insight` job above already does. Only
      # argon2-cffi is installed, not `-e insight/` -- the proof puts the repo root on sys.path
      # itself, so it needs the KDF and nothing else (no duckdb, no fastapi in this job).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install argon2-cffi (the login proof signs in through the real credential bridge)
        run: python -m pip install --upgrade pip argon2-cffi

      - name: web checks (type-check, lint, unit tests, build) via insight/verify_web.py
        run: python3 insight/verify_web.py
      # Browser-dependent -- deliberately NOT part of verify_web.py's CHECKS, see this job's own
      # header comment above for why. node_modules is already installed here by the verify_web.py
      # step above (its own `npm ci`), so neither step below needs a separate `npm ci`.
      #
      # The browser IS installed explicitly, on purpose. `ubuntu-latest` does ship Google Chrome
      # (confirmed against actions/runner-images' own Ubuntu 24.04 inventory), and
      # prove-fonts-actually-apply.mjs prefers it via `channel: "chrome"` -- but "the runner
      # happens to have a browser" is the same incidental dependency that got the earlier version
      # of this proof blocked in review, just moved from a dev box to a runner image. Chrome's
      # sandbox on Ubuntu 24.04 depends on unprivileged user namespaces, which that release
      # restricts by default, and the runner image's browser inventory is not a contract this repo
      # controls. So the script's documented fallback -- Playwright's own bundled Chromium -- is
      # made REAL here rather than left as a path that would itself throw "please run npx playwright
      # install". `--with-deps` pulls the matching system libraries. This is provisioning, never a
      # weakening: the proof itself is unchanged and still fails loudly if no browser launches.
      - name: install the Playwright browser the font proof falls back to
        run: npx playwright install --with-deps chromium
        working-directory: insight/web
      - name: prove fonts actually apply (npm run prove:fonts)
        run: npm run prove:fonts
        working-directory: insight/web
      # issue #304 [E17.S3], .sdlc/plans/304.md Decision (d)/Step 6. Reuses the browser the font
      # proof's own install step above already provisioned -- zero incremental provisioning cost,
      # same job, same reasoning as prove:fonts. Deliberately NOT in verify_web.py's CHECKS/the
      # always-on gate -- see that script's own docstring and this job's header comment for why a
      # browser-dependent check cannot live there. Starts its own `next start` server against the
      # `.next` output the `npm run build` check above (this job's own step) already produced,
      # under this job's own INSIGHT_DEV_ROUTES=1 -- no rebuild.
      - name: prove absence primitives render + are visually distinct (npm run prove:absence-states)
        run: npm run prove:absence-states
        working-directory: insight/web
      # issue #305 [E17.S4], .sdlc/plans/305.md Step 6. Reuses the SAME browser prove:fonts's
      # install step above already provisioned, and the SAME .next build / INSIGHT_DEV_ROUTES=1
      # env prove:absence-states already relies on -- zero incremental provisioning cost, same
      # job, same reasoning as prove:absence-states itself.
      - name: prove shell reflows at 1440/1024/768 with no page-level horizontal scroll (npm run prove:shell-responsive)
        run: npm run prove:shell-responsive
        working-directory: insight/web
      # issue #310 [E19.S2], .sdlc/plans/310.md Decision 7. `insight web ic`'s query path imports
      # duckdb (via insight.dash.ic/insight.ingest.store) -- the first thing this job's python3
      # invocations have ever needed that isn't already satisfiable from the repo's own source
      # tree (users verify, exercised by prove-python-bridge-exit-codes.mjs above, never hit this:
      # insight.accounts.store has no third-party dependency). Mirrors the `insight` job's own two
      # install steps verbatim, so there is one source of truth for "what insight/ needs
      # installed," not a second, independently-drifting duckdb~=1.4 pip line.
      #
      # issue #312 [E20.S1] Goal B: MOVED earlier in this job (was positioned just before
      # prove:ic-bridge) to run BEFORE prove:role-forbidden instead. Task B3 landed a real
      # app/delivery/page.tsx, and prove:role-forbidden's own script now fetches that page for a
      # granted role -- which spawns `python3 -m insight web delivery`
      # (src/lib/delivery/pythonBridge.ts), whose query path imports duckdb the same way `web ic`
      # already does. Reusing this SAME install (not a second one) is why it moves rather than
      # duplicates -- see prove-role-forbidden-real-server.mjs's own header comment for the full
      # "why this script gained a duckdb dependency" story.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install insight/ and its own deps (duckdb) -- prove:role-forbidden's /delivery checks and prove:ic-no-leak's seed-ic-fixture.py both need it
        run: python -m pip install -e insight/
      # issue #309 [E19.S1], .sdlc/plans/309.md item (b) (independent plan-review gap). Reuses the
      # SAME .next build the checks above already produced -- no rebuild. Deliberately NOT part of
      # verify_web.py's CHECKS/the always-on local gate, same reasoning as the three browser proofs
      # above (a booted `next start` server has no place in a repo-wide gate that must run in a
      # fresh worktree for every goal) -- this one needs no browser at all (plain fetch + a real
      # Auth.js-minted session cookie is enough to observe a real HTTP 403/200), so it does not
      # depend on the Playwright install step above; it DOES now depend on the duckdb install step
      # just above (issue #312 [E20.S1] Goal B -- see that step's own comment).
      - name: prove role survives Auth.js's real JWT pipeline at the proxy layer, and the real /delivery board renders for a granted role (npm run prove:role-forbidden)
        run: npm run prove:role-forbidden
        working-directory: insight/web
      # CI-only, same family as prove:fonts/prove:role-forbidden above (a booted-server proof has
      # no place in the always-on offline local gate -- see insight/verify_web.py's own docstring
      # and .sdlc/config.json's own no-pip-install invariant). Placed after prove:role-forbidden,
      # the same "no browser needed" family, and after the two install steps above since its
      # own seed-ic-fixture.py needs a real duckdb.
      # Same duckdb dependency, same reason it cannot live in verify_web.py's CHECKS: this proof
      # drives the REAL `python3 -m insight web ic`, whose query path imports duckdb. It was in
      # `npm run test` on first push and failed CI here (ModuleNotFoundError: duckdb) while passing
      # locally, because `npm run test` runs at the top of this job -- before the pip install just
      # above -- and a developer machine happens to have duckdb already. Local green hid it; only
      # CI's clean interpreter surfaced it. It belongs beside prove:ic-no-leak, after the install.
      - name: prove the /ic python bridge maps exit codes to typed errors (npm run prove:ic-bridge)
        run: npm run prove:ic-bridge
        working-directory: insight/web
      - name: prove no cross-actor leak on /ic, server-side, across two real identities (npm run prove:ic-no-leak)
        run: npm run prove:ic-no-leak
        working-directory: insight/web
      # issue #312 [E20.S1] Goal B, Task B2. Same family/reasoning as prove:ic-bridge immediately
      # above -- compiles and drives the real delivery bridge against the real
      # `python3 -m insight web delivery`, needs the same already-installed duckdb.
      - name: prove the /delivery python bridge maps exit codes to typed errors (npm run prove:delivery-bridge)
        run: npm run prove:delivery-bridge
        working-directory: insight/web
      # issue #312 [E20.S1] Goal B, Task B4 (done-when 4): the mandatory cold-start proof, CI-only
      # for the same reason prove:ic-no-leak is -- needs a real, schema-only DuckDB store, which
      # `npm run test`'s offline chain (run before any pip install, in a fresh worktree) cannot
      # provide (the exact #310 scar this job's own comments elsewhere already document). Seeds a
      # zero-row store, boots a real server against it, and asserts no numeral renders anywhere on
      # /delivery -- plus its own MANDATORY executed negative control (reseed with metric_12
      # populated, confirm the same check now finds a digit) proving the check has real teeth.
      - name: prove the delivery panel's cold start renders no numerals anywhere (npm run prove:delivery-cold-start)
        run: npm run prove:delivery-cold-start
        working-directory: insight/web
      - name: docker build (Dockerfile.web) -- the Dockerfile is proven to build, not just present
        run: docker build -f insight/Dockerfile.web -t insight-web-scaffold:ci insight/
