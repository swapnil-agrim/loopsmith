[build-system]
# >=77, not 61: PEP 639 (`license` as an SPDX string + `license-files`) is only
# accepted from setuptools 77. Build isolation hides this by fetching the newest,
# but --no-build-isolation or a pinned/distro setuptools fails with a confusing
# "project.license must be valid exactly by one definition" error.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The DISTRIBUTION name. Not "insight": that is already taken on PyPI (0.8/0.9/1.0
# exist), so publishing under it is impossible and `pip install insight` would fetch an
# unrelated package. The IMPORT name stays `insight` via [tool.setuptools] package-dir
# below — only this string moves. Verified free: pypi.org/pypi/loopsmith-insight -> 404.
name = "loopsmith-insight"
dynamic = ["version"]
description = "LoopSmith Insight: the analytics platform and configuration UI for LoopSmith."
readme = "README.md"
license = "BUSL-1.1"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    # Compatible-release clause: a lower bound (1.4) and an upper bound at the next
    # major (<2.0) in one token, so a breaking major bump can't slip in silently.
    "duckdb~=1.4",
    # THREE-component pin, not two (issue #299 [E16.S1], .sdlc/plans/299.md Decision 2): fastapi
    # is pre-1.0, where a two-component ~=0.116 resolves to >=0.116,<1.0 -- admitting every
    # future 0.x release, far too broad. ~=0.116.1 locks the 0.116.x line, verified directly with
    # packaging.specifiers.SpecifierSet. Do not "simplify" this to ~=0.116.
    # httpx (fastapi.testclient.TestClient's own dependency) is DELIBERATELY not listed here --
    # it is test-only, never imported by the shipped app, and lives on
    # .github/workflows/ci.yml's insight-job install line instead. See Decision 2.
    "fastapi~=0.116.1",
]

[project.scripts]
insight = "insight.__main__:main"

[tool.setuptools]
# insight/ is both the pip project root (this file) and the "insight" import root —
# there is no separate src/ or nested insight/insight/. package-dir reroutes the
# "insight" package (and everything under it) to ".", i.e. this directory, so
# insight/ingest/ resolves as insight.ingest instead of a stray top-level "ingest".
packages = ["insight", "insight.ingest", "insight.metrics", "insight.gaps", "insight.dash",
            "insight.contract", "insight.api"]
package-dir = { "insight" = "." }

[tool.setuptools.dynamic]
# The single source of truth is the VERSION file, not this file — see VERSION.
version = { file = "VERSION" }

[tool.setuptools.package-data]
# metrics/*.sql (issue #108) is the first non-.py asset under insight/ -- packages=[...] alone
# ships only .py files, so a real (non-editable) wheel build silently drops every .sql file
# without this. VERIFIED live: a scratch build before this line omits a planted metrics/1.sql;
# after, it's present. See .sdlc/plans/108.md Design decision H. CI's `pip install -e insight/`
# and the local verify gate's lack of any install step both mean this gap was invisible today
# — it would only bite a real `pip install loopsmith-insight` from a built wheel.
"insight.metrics" = ["*.sql"]
# gaps/*.sql (issue #116) is insight.gaps's own first non-.py asset, the exact same gap
# test_pyproject_declares_package_data_for_metric_sql_files above already exists to catch for
# a sibling package -- fixed now, before issue #117 lands the first real gap rule .sql file, so
# there is never a window where the first real rule would silently vanish from a built wheel.
"insight.gaps" = ["*.sql"]
# dash/fonts/*.txt (issue #262, D1) is insight.dash's own first non-.py asset -- the two OFL
# licence texts that must travel with the embedded, subsetted Atkinson Hyperlegible/IBM Plex
# Mono WOFF2 payloads (OFL 1.1 Requirement: "Copies of the OFL... must be distributed with any
# Font Software"). Without this line, packages=[...] alone ships only insight/dash/*.py and a
# real (non-editable) wheel silently drops both licence files, same gap class as the two
# entries above.
"insight.dash" = ["fonts/*.txt"]
# contract/*.jsonl,*.json,*.md (issue #298) is insight.contract's own first non-.py asset -- the
# golden engine<->product data-contract fixtures -- same gap class as the three entries above:
# packages=[...] alone ships only .py files, so a real (non-editable) wheel build would silently
# drop every fixture without this. Added together with the packages=[...] entry above so the two
# never land in separate steps with a window where one is missing.
"insight.contract" = ["*.jsonl", "*.json", "*.md"]
# api/README.md (issue #299 [E16.S1]) is insight.api's own first non-.py asset -- pre-written by
# E15.S2, already in source before this story lands any .py file. Same gap class as the four
# entries above: packages=[...] alone ships only .py files, so a real (non-editable) wheel build
# would silently drop this README without this line. Added together with the packages=[...]
# entry above (plan-review amendment 3) so the two never land in separate steps with a window
# where one is missing -- exactly the discipline #108/#116/#262/#298 each show was missing.
"insight.api" = ["*.md"]
